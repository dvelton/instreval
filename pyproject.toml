[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instreval"
version = "0.1.0"
description = "A/B test and audit your AI custom instructions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "dvelton" }]
keywords = ["ai", "llm", "evaluation", "custom-instructions", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "litellm>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
instreval = "instreval.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/instreval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
