model: "claude-sonnet-4-20250514"

instructions:
  baseline: baseline.txt
  candidate: candidate.txt

prompts:
  - id: memo-draft
    text: "Draft a one-page memo summarizing the risks of adopting third-party AI models in a production environment."
  - id: strategy-summary
    text: "Summarize the key strategic considerations for launching a developer platform."
  - id: email-response
    text: "Write a professional response to a customer asking about our data retention and deletion policies."
  - id: blog-intro
    text: "Write the opening three paragraphs of a blog post about why API design matters."
  - id: incident-report
    text: "Draft an incident report summary for a 2-hour service outage caused by a misconfigured load balancer."

scoring:
  dimensions:
    - name: conciseness
      type: llm_judge
      criteria: "Rate how concise the response is. Penalize unnecessary filler, repetition, redundant summaries, and padding. A 10 means every sentence adds new information."

    - name: ai_patterns
      type: rule_based
      rules:
        - pattern: " — "
          name: em_dash_overuse
          max_allowed: 2
        - pattern: "(?i)it'?s not .{1,50}[—–].{0,5}it'?s"
          name: negative_parallelism
          max_allowed: 0
        - pattern: "(?i)(let'?s (break this down|unpack|explore|dive in))"
          name: pedagogical_framing
          max_allowed: 0
        - pattern: "(?i)(it'?s worth noting|importantly,|interestingly,|notably,)"
          name: filler_transitions
          max_allowed: 0
        - pattern: "(?i)(the result\\?|the worst part\\?|the scary part\\?|here'?s the (kicker|thing))"
          name: rhetorical_self_questions
          max_allowed: 0
        - pattern: "(?i)think of it (as|like)"
          name: patronizing_analogy
          max_allowed: 0

    - name: actionability
      type: llm_judge
      criteria: "Rate how actionable the response is. Does it lead with what to do and concrete next steps? Penalize responses that start with background context or theory before getting to the point."

    - name: natural_voice
      type: llm_judge
      criteria: "Rate how natural and human the writing sounds. Penalize text that reads like it was generated by an AI — overly polished, symmetrical structures, manufactured drama, grandiose stakes inflation. Reward text that reads like a competent human wrote it on the first draft."

runs: 3
